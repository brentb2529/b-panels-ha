    name: Kitchen Zone
    unique_id: sig_climate_kitchen
    heater: input_boolean.sig_hvac_kitchen
    target_sensor: sensor.kitchen_zone_temp
    ac_mode: true
    min_temp: 60
    max_temp: 85
    target_temp: 72
  - platform: generic_thermostat
    name: Living Zone
    unique_id: sig_climate_living
    heater: input_boolean.sig_hvac_living
    target_sensor: sensor.living_zone_temp
    ac_mode: true
    min_temp: 60
    max_temp: 85
    target_temp: 72
  - platform: generic_thermostat
    name: Primary Zone
    unique_id: sig_climate_primary
    heater: input_boolean.sig_hvac_primary
    target_sensor: sensor.primary_zone_temp
    ac_mode: true
    min_temp: 60
    max_temp: 85
    target_temp: 72

# Sonos in dev: scenes call media_player.* against the real Sonos id in prod.
# In dev (no Sonos hardware) the scene mirrors the intended Sonos state onto
# input_select.sig_media_state so the round-trip is observable. This is the only
# spot a scene targets a non-core demo helper; in prod the media_player.* lines
# fire against the real Sonos and these helper writes are simply harmless.

# =============================================================================
# THE SIX SIGNATURE SCENE SCRIPTS — low-hazard orchestration ONLY
# =============================================================================
# Each is GENERIC: target entities are `fields` with dev defaults, so a prod
# deployment passes its own Lutron/cover/Airzone/Sonos ids with no edit. They
# call ONLY generic domain services on low-hazard actors:
#   light.turn_on/off · cover.set_cover_position · climate.set_temperature +
#   set_hvac_mode · media_player.* (Sonos).
# They contain NO arm/disarm, NO lock/gate, NO AKVO floor move, NO pool BODY/
# pump/heater, NO CLiC glass, NO garage. The gated finishing step for each is
# surfaced in the b-panels UI behind an explicit confirm — never here.
#
# `sonos_player` defaults to the dev demo Sonos id; set to "" to skip audio.
# All scripts mirror the intended Sonos state onto input_select.sig_media_state
# (dev observability) AND fire media_player.* against `sonos_player` (prod).
# =============================================================================
script:

  # ── 1. GOODNIGHT — wind the house down (lights low/off, shades down, HVAC
  #      setback, quiet audio). Gated finishing step (UI): "Arm Night + lock up?"
  scene_goodnight:
    alias: "Scene · Goodnight"
    icon: mdi:weather-night
    mode: restart
    fields:
      interior_lights:
        description: Interior lights to turn off
        default: [light.great_room_lights, light.kitchen_house_lights, light.office_lights, light.foyer_lights, light.gym_lights]
      bedside_lights:
        description: Lights to leave low for navigation
        default: [light.master_lights]
      shades:
        description: Shades to lower for the night
        default: [cover.master_shade, cover.great_room_shade, cover.theater_shade]
      climate_zones:
        default: [climate.kitchen_zone, climate.living_zone, climate.primary_zone]
      night_setpoint:
        default: 68
      sonos_player:
        default: media_player.great_room_sonos
    # Resolve every field to its default when called bare (script.turn_on does
    # not auto-apply field defaults). Prod callers may override any of these.
    variables:
      interior_lights: "{{ interior_lights | default(['light.great_room_lights','light.kitchen_house_lights','light.office_lights','light.foyer_lights','light.gym_lights']) }}"
      bedside_lights: "{{ bedside_lights | default(['light.master_lights']) }}"
      shades: "{{ shades | default(['cover.master_shade','cover.great_room_shade','cover.theater_shade']) }}"
      climate_zones: "{{ climate_zones | default(['climate.kitchen_zone','climate.living_zone','climate.primary_zone']) }}"
      night_setpoint: "{{ night_setpoint | default(68) }}"
      sonos_player: "{{ sonos_player | default('media_player.great_room_sonos') }}"
    sequence:
      - service: light.turn_off
        target: { entity_id: "{{ interior_lights }}" }
      - service: light.turn_on
        target: { entity_id: "{{ bedside_lights }}" }
        data: { brightness_pct: 8 }
      - repeat:
          for_each: "{{ shades }}"
          sequence:
            - service: cover.set_cover_position
              target: { entity_id: "{{ repeat.item }}" }
              data: { position: 0 }
      - service: climate.set_temperature
        target: { entity_id: "{{ climate_zones }}" }
        data: { temperature: "{{ night_setpoint }}" }
      - service: light.turn_off
        target: { entity_id: [light.patio_lights, light.landscape_lights] }
      - service: input_select.select_option
        target: { entity_id: input_select.sig_media_state }
        data: { option: idle }
      - if: "{{ sonos_player | length > 0 }}"
        then:
          - service: media_player.turn_off
            target: { entity_id: "{{ sonos_player }}" }
      - service: input_text.set_value
        target: { entity_id: input_text.sig_last_scene }
        data: { value: "Goodnight" }

  # ── 2. WAKE — gentle morning ramp (warm light up, shades up, HVAC to comfort,
  #      optional Sonos). Time-aware: typically fired by a morning trigger.
  scene_wake:
    alias: "Scene · Wake"
    icon: mdi:weather-sunset-up
    mode: restart
    fields:
      wake_lights:
        default: [light.master_lights, light.kitchen_house_lights, light.foyer_lights]
      shades:
        default: [cover.master_shade, cover.great_room_shade]
      climate_zones:
        default: [climate.kitchen_zone, climate.living_zone, climate.primary_zone]
      comfort_setpoint:
        default: 72
      sonos_player:
        default: media_player.great_room_sonos
      play_audio:
        default: true
    variables:
      wake_lights: "{{ wake_lights | default(['light.master_lights','light.kitchen_house_lights','light.foyer_lights']) }}"
      shades: "{{ shades | default(['cover.master_shade','cover.great_room_shade']) }}"
      climate_zones: "{{ climate_zones | default(['climate.kitchen_zone','climate.living_zone','climate.primary_zone']) }}"
      comfort_setpoint: "{{ comfort_setpoint | default(72) }}"
      sonos_player: "{{ sonos_player | default('media_player.great_room_sonos') }}"
      play_audio: "{{ play_audio | default(true) }}"
    sequence:
      - service: light.turn_on
        target: { entity_id: "{{ wake_lights }}" }
        data: { brightness_pct: 60 }
      - repeat:
          for_each: "{{ shades }}"
          sequence:
            - service: cover.set_cover_position
              target: { entity_id: "{{ repeat.item }}" }
              data: { position: 100 }
      - service: climate.set_hvac_mode
        target: { entity_id: "{{ climate_zones }}" }
        data: { hvac_mode: cool }
      - service: climate.set_temperature
        target: { entity_id: "{{ climate_zones }}" }
        data: { temperature: "{{ comfort_setpoint }}" }
      - if: "{{ play_audio }}"
        then:
          - service: input_select.select_option
            target: { entity_id: input_select.sig_media_state }
            data: { option: playing }
          - service: input_select.select_option
            target: { entity_id: input_select.sig_media_source }
            data: { option: "Morning Acoustic" }
          - if: "{{ sonos_player | length > 0 }}"
            then:
              - service: media_player.turn_on
                target: { entity_id: "{{ sonos_player }}" }
      - service: input_text.set_value
        target: { entity_id: input_text.sig_last_scene }
        data: { value: "Wake" }

  # ── 3. MOVIE — theater/family-room dim, shades down for the room, comfort hold.
  #      Gated finishing step (UI): "CLiC privacy glass to opaque?" (display-only).
  scene_movie:
    alias: "Scene · Movie"
    icon: mdi:movie-open
    mode: restart
    fields:
      theater_lights:
        default: [light.theater_lights]
      dim_lights:
        default: [light.great_room_lights]
      off_lights:
        default: [light.kitchen_house_lights, light.foyer_lights, light.office_lights]
      shades:
        default: [cover.theater_shade, cover.great_room_shade]
      sonos_player:
        default: media_player.great_room_sonos
    variables:
      theater_lights: "{{ theater_lights | default(['light.theater_lights']) }}"
      dim_lights: "{{ dim_lights | default(['light.great_room_lights']) }}"
      off_lights: "{{ off_lights | default(['light.kitchen_house_lights','light.foyer_lights','light.office_lights']) }}"
      shades: "{{ shades | default(['cover.theater_shade','cover.great_room_shade']) }}"
      sonos_player: "{{ sonos_player | default('media_player.great_room_sonos') }}"
    sequence:
      - service: light.turn_on
        target: { entity_id: "{{ theater_lights }}" }
        data: { brightness_pct: 5 }
      - service: light.turn_on
        target: { entity_id: "{{ dim_lights }}" }
        data: { brightness_pct: 15 }
      - service: light.turn_off
        target: { entity_id: "{{ off_lights }}" }
      - repeat:
          for_each: "{{ shades }}"
          sequence:
            - service: cover.set_cover_position
              target: { entity_id: "{{ repeat.item }}" }
              data: { position: 0 }
      - service: input_select.select_option
        target: { entity_id: input_select.sig_media_state }
        data: { option: paused }
      - if: "{{ sonos_player | length > 0 }}"
        then:
          - service: media_player.media_pause
            target: { entity_id: "{{ sonos_player }}" }
      - service: input_text.set_value
        target: { entity_id: input_text.sig_last_scene }
        data: { value: "Movie" }

  # ── 4. ENTERTAIN — pool/deck/landscape lights up, music zones on, exterior
  #      shading for sun. Pool BODY/heater stays gated (NOT here).
  scene_entertain:
    alias: "Scene · Entertain"
    icon: mdi:party-popper
    mode: restart
    fields:
      ambiance_lights:
        default: [light.great_room_lights, light.kitchen_house_lights, light.patio_lights]
      exterior_lights:
        description: Pool + landscape LIGHTS (low-hazard) — never pool body/pump
        default: [light.pool_lights, light.landscape_lights]
      shades:
        default: [cover.patio_shade, cover.great_room_shade]
      sonos_player:
        default: media_player.great_room_sonos
    variables:
      ambiance_lights: "{{ ambiance_lights | default(['light.great_room_lights','light.kitchen_house_lights','light.patio_lights']) }}"
      exterior_lights: "{{ exterior_lights | default(['light.pool_lights','light.landscape_lights']) }}"
      shades: "{{ shades | default(['cover.patio_shade','cover.great_room_shade']) }}"
      sonos_player: "{{ sonos_player | default('media_player.great_room_sonos') }}"
    sequence:
      - service: light.turn_on
        target: { entity_id: "{{ ambiance_lights }}" }
        data: { brightness_pct: 70 }
      - service: light.turn_on
        target: { entity_id: "{{ exterior_lights }}" }
        data: { brightness_pct: 85 }
      - repeat:
          for_each: "{{ shades }}"
          sequence:
            - service: cover.set_cover_position
              target: { entity_id: "{{ repeat.item }}" }
              data: { position: 60 }
      - service: input_select.select_option
        target: { entity_id: input_select.sig_media_state }
        data: { option: playing }
      - service: input_select.select_option
        target: { entity_id: input_select.sig_media_source }
        data: { option: "Party Mix" }
      - if: "{{ sonos_player | length > 0 }}"
        then:
          - service: media_player.turn_on
            target: { entity_id: "{{ sonos_player }}" }
      - service: input_text.set_value
        target: { entity_id: input_text.sig_last_scene }
        data: { value: "Entertain" }

  # ── 5. VACATION — eco HVAC, presence-sim baseline, audio off. Gated finishing
  #      step (UI): "Arm Away + (optional) water main shutoff?" (display-only).
  scene_vacation:
    alias: "Scene · Vacation"
    icon: mdi:bag-suitcase
    mode: restart
    fields:
      all_lights:
        default: [light.great_room_lights, light.master_lights, light.kitchen_house_lights, light.foyer_lights, light.office_lights, light.gym_lights, light.theater_lights, light.patio_lights]
      presence_sim_lights:
        description: A small set left on as a deterrent baseline
        default: [light.foyer_lights]
      shades:
        default: [cover.great_room_shade, cover.master_shade, cover.theater_shade, cover.patio_shade]
      climate_zones:
        default: [climate.kitchen_zone, climate.living_zone, climate.primary_zone]
      eco_setpoint:
        default: 78
      sonos_player:
        default: media_player.great_room_sonos
    variables:
      all_lights: "{{ all_lights | default(['light.great_room_lights','light.master_lights','light.kitchen_house_lights','light.foyer_lights','light.office_lights','light.gym_lights','light.theater_lights','light.patio_lights']) }}"
      presence_sim_lights: "{{ presence_sim_lights | default(['light.foyer_lights']) }}"
      shades: "{{ shades | default(['cover.great_room_shade','cover.master_shade','cover.theater_shade','cover.patio_shade']) }}"
      climate_zones: "{{ climate_zones | default(['climate.kitchen_zone','climate.living_zone','climate.primary_zone']) }}"
      eco_setpoint: "{{ eco_setpoint | default(78) }}"
      sonos_player: "{{ sonos_player | default('media_player.great_room_sonos') }}"
    sequence:
      - service: light.turn_off
        target: { entity_id: "{{ all_lights }}" }
      - service: light.turn_on
        target: { entity_id: "{{ presence_sim_lights }}" }
        data: { brightness_pct: 40 }
      - repeat:
          for_each: "{{ shades }}"
          sequence:
            - service: cover.set_cover_position
              target: { entity_id: "{{ repeat.item }}" }
              data: { position: 30 }
      - service: climate.set_hvac_mode
        target: { entity_id: "{{ climate_zones }}" }
        data: { hvac_mode: cool }
      - service: climate.set_temperature
        target: { entity_id: "{{ climate_zones }}" }
        data: { temperature: "{{ eco_setpoint }}" }
      - service: light.turn_off
        target: { entity_id: [light.pool_lights, light.landscape_lights] }
      - service: input_select.select_option
        target: { entity_id: input_select.sig_media_state }
        data: { option: idle }
      - if: "{{ sonos_player | length > 0 }}"
        then:
          - service: media_player.turn_off
            target: { entity_id: "{{ sonos_player }}" }
      - service: input_text.set_value
        target: { entity_id: input_text.sig_last_scene }
        data: { value: "Vacation" }

  # ── 6. AWAY-ARRIVAL — coming home (entry lights, HVAC recover, light music).
  #      Gated finishing step (UI): "Disarm to Home + unlock front door?"
  #      (display-only). Designed to be fired by a geofence/gate trigger later.
  scene_away_arrival:
    alias: "Scene · Away-Arrival"
    icon: mdi:home-import-outline
    mode: restart
    fields:
      entry_lights:
        default: [light.foyer_lights, light.great_room_lights, light.kitchen_house_lights]
      exterior_lights:
        default: [light.landscape_lights]
      shades:
        default: [cover.great_room_shade]
      climate_zones:
        default: [climate.kitchen_zone, climate.living_zone, climate.primary_zone]
      comfort_setpoint:
        default: 72
      sonos_player:
        default: media_player.great_room_sonos
    variables:
      entry_lights: "{{ entry_lights | default(['light.foyer_lights','light.great_room_lights','light.kitchen_house_lights']) }}"
      exterior_lights: "{{ exterior_lights | default(['light.landscape_lights']) }}"
      shades: "{{ shades | default(['cover.great_room_shade']) }}"
      climate_zones: "{{ climate_zones | default(['climate.kitchen_zone','climate.living_zone','climate.primary_zone']) }}"
      comfort_setpoint: "{{ comfort_setpoint | default(72) }}"
      sonos_player: "{{ sonos_player | default('media_player.great_room_sonos') }}"
    sequence:
      - service: light.turn_on
        target: { entity_id: "{{ entry_lights }}" }
        data: { brightness_pct: 75 }
      - service: light.turn_on
        target: { entity_id: "{{ exterior_lights }}" }
        data: { brightness_pct: 60 }
      - repeat:
          for_each: "{{ shades }}"
          sequence:
            - service: cover.set_cover_position
              target: { entity_id: "{{ repeat.item }}" }
              data: { position: 80 }
      - service: climate.set_hvac_mode
        target: { entity_id: "{{ climate_zones }}" }
        data: { hvac_mode: cool }
      - service: climate.set_temperature
        target: { entity_id: "{{ climate_zones }}" }
        data: { temperature: "{{ comfort_setpoint }}" }
      - service: input_select.select_option
        target: { entity_id: input_select.sig_media_state }
        data: { option: playing }
      - service: input_select.select_option
        target: { entity_id: input_select.sig_media_source }
        data: { option: "Dinner Jazz" }
      - if: "{{ sonos_player | length > 0 }}"
        then:
          - service: media_player.turn_on
            target: { entity_id: "{{ sonos_player }}" }
      - service: input_text.set_value
        target: { entity_id: input_text.sig_last_scene }
        data: { value: "Away-Arrival" }
