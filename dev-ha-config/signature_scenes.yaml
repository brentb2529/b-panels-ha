# =============================================================================
# Signature whole-house scenes — dev package (coordinator-owned)
# =============================================================================
# Provides, for the b-panels "Signature scenes" experience layer:
#
#   1. SIX server-side orchestration SCRIPTS (script.scene_goodnight, etc.).
#      These fire ONLY the LOW-HAZARD actors — Lutron lights/brightness, shades/
#      covers position, HVAC setpoint+mode (comfort), Sonos, and pool/landscape
#      LIGHTS + effects. They are GENERIC: every target entity is a script
#      `field` with a dev-default, so a production deployment passes its own
#      Lutron/Sonos/IntelliCenter entity ids with no code change and no site
#      hardcoding. They call only generic HA domain services.
#
#      They contain NO gated actor (no arm/disarm, no lock/gate, no AKVO floor,
#      no pool BODY/pump/heater, no CLiC glass, no garage). Those stay on the
#      existing confirm-gated path in the b-panels UI and issue NO live actuation.
#
#   2. Real, locally-backed DEMO entities (template lights/covers/climate +
#      a Sonos-shaped media_player) so the generic service calls demonstrably
#      MOVE STATE in dev. In production these are replaced by the real Lutron /
#      cover / Airzone / Sonos entities — the scripts don't change.
#
#   3. GATED-ACTOR demo entities (alarm panel, door lock, garage, CLiC glass,
#      pool body) provisioned as inert input_booleans so the forced-check proof
#      can assert that triggering a scene leaves every one of them UNTOUCHED.
#
# Safety contract (CLAUDE.md + ECOSYSTEM §H1): equipment-gated / security /
# AKVO actors are NEVER auto-actuated inside a scene. This file enforces that by
# construction — grep it: no scene_* script references any gated entity.
# =============================================================================

# ── helper state behind the dev-demo template entities ───────────────────────
input_boolean:
  # low-hazard demo light backings (template lights below read/drive these)
  sig_light_great_room: { name: "Great Room", icon: mdi:light-recessed }
  sig_light_master: { name: "Master", icon: mdi:light-recessed }
  sig_light_kitchen_house: { name: "Kitchen", icon: mdi:light-recessed }
  sig_light_foyer: { name: "Foyer", icon: mdi:light-recessed }
  sig_light_office: { name: "Office", icon: mdi:light-recessed }
  sig_light_patio: { name: "Patio", icon: mdi:light-recessed }
  sig_light_gym: { name: "Gym", icon: mdi:light-recessed }
  sig_light_theater: { name: "Theater", icon: mdi:light-recessed }
  sig_pool_light: { name: "Pool Light", icon: mdi:pool }
  sig_landscape_light: { name: "Landscape Light", icon: mdi:outdoor-lamp }
  # inert demo "AC relay" booleans backing the generic_thermostat zones (no real
  # HVAC hardware in dev); they only flip as the dummy thermostat regulates.
  sig_hvac_kitchen: { name: "Kitchen AC relay (demo)", icon: mdi:hvac }
  sig_hvac_living: { name: "Living AC relay (demo)", icon: mdi:hvac }
  sig_hvac_primary: { name: "Primary AC relay (demo)", icon: mdi:hvac }

  # ── GATED ACTORS — display/confirm-only; scenes must NEVER drive these ──
  # Provisioned inert so the forced-check can prove zero scene-driven changes.
  gated_alarm_armed: { name: "[GATED] Alarm Armed", icon: mdi:shield }
  gated_front_door_locked: { name: "[GATED] Front Door Lock", icon: mdi:lock }
  gated_garage_open: { name: "[GATED] Garage Door", icon: mdi:garage }
  gated_clic_privacy: { name: "[GATED] CLiC Privacy Glass", icon: mdi:blinds }
  gated_pool_body: { name: "[GATED] Pool Body / Pump", icon: mdi:pump }
  gated_akvo_floor_move: { name: "[GATED] AKVO Floor Move", icon: mdi:elevator }

input_number:
  sig_bright_great_room: { name: "Great Room brightness", min: 0, max: 255, step: 1, mode: box }
  sig_bright_master: { name: "Master brightness", min: 0, max: 255, step: 1, mode: box }
  sig_bright_kitchen_house: { name: "Kitchen brightness", min: 0, max: 255, step: 1, mode: box }
  sig_bright_foyer: { name: "Foyer brightness", min: 0, max: 255, step: 1, mode: box }
  sig_bright_office: { name: "Office brightness", min: 0, max: 255, step: 1, mode: box }
  sig_bright_patio: { name: "Patio brightness", min: 0, max: 255, step: 1, mode: box }
  sig_bright_gym: { name: "Gym brightness", min: 0, max: 255, step: 1, mode: box }
  sig_bright_theater: { name: "Theater brightness", min: 0, max: 255, step: 1, mode: box }
  sig_bright_pool_light: { name: "Pool light brightness", min: 0, max: 255, step: 1, mode: box }
  sig_bright_landscape_light: { name: "Landscape brightness", min: 0, max: 255, step: 1, mode: box }
  # shade positions (0 closed .. 100 open)
  sig_cover_great_room: { name: "Great Room shade", min: 0, max: 100, step: 1, mode: box, initial: 80 }
  sig_cover_master: { name: "Master shade", min: 0, max: 100, step: 1, mode: box, initial: 80 }
  sig_cover_theater: { name: "Theater shade", min: 0, max: 100, step: 1, mode: box, initial: 80 }
  sig_cover_patio: { name: "Patio shade", min: 0, max: 100, step: 1, mode: box, initial: 80 }
  # climate setpoints + current temp
  sig_climate_kitchen_set: { name: "Kitchen setpoint", min: 60, max: 85, step: 0.5, mode: box, initial: 72 }
  sig_climate_living_set: { name: "Living setpoint", min: 60, max: 85, step: 0.5, mode: box, initial: 72 }
  sig_climate_primary_set: { name: "Primary setpoint", min: 60, max: 85, step: 0.5, mode: box, initial: 72 }
  sig_climate_kitchen_cur: { name: "Kitchen temp", min: 50, max: 95, step: 0.1, mode: box, initial: 73 }
  sig_climate_living_cur: { name: "Living temp", min: 50, max: 95, step: 0.1, mode: box, initial: 72 }
  sig_climate_primary_cur: { name: "Primary temp", min: 50, max: 95, step: 0.1, mode: box, initial: 71 }

input_select:
  sig_climate_kitchen_mode:
    name: "Kitchen mode"
    options: [off, cool, heat, heat_cool]
    initial: cool
  sig_climate_living_mode:
    name: "Living mode"
    options: [off, cool, heat, heat_cool]
    initial: cool
  sig_climate_primary_mode:
    name: "Primary mode"
    options: [off, cool, heat, heat_cool]
    initial: cool
  sig_media_state:
    name: "Sonos state"
    options: [idle, playing, paused]
    initial: idle
  sig_media_source:
    name: "Sonos source"
    options: ["—", "Morning Acoustic", "Dinner Jazz", "Party Mix", "Sleep Sounds"]
    initial: "—"

input_text:
  sig_last_scene:
    name: "Last signature scene"
    initial: "—"
    max: 64

# ── Template entities the b-panels demo binds to (REAL, locally driven) ──────
# These give the generic light.* / cover.* / climate.* / media_player.* service
# calls something real to actuate in dev. Their entity_ids match the ids the
# HomePanel + panels already reference.
template:
  - sensor:
      - name: "Kitchen Zone Temp"
        unique_id: sig_temp_kitchen
        unit_of_measurement: "°F"
        device_class: temperature
        state: "{{ states('input_number.sig_climate_kitchen_cur') | float(73) }}"
      - name: "Living Zone Temp"
        unique_id: sig_temp_living
        unit_of_measurement: "°F"
        device_class: temperature
        state: "{{ states('input_number.sig_climate_living_cur') | float(72) }}"
      - name: "Primary Zone Temp"
        unique_id: sig_temp_primary
        unit_of_measurement: "°F"
        device_class: temperature
        state: "{{ states('input_number.sig_climate_primary_cur') | float(71) }}"

# Real, core climate entities (generic_thermostat) — respond natively to
# climate.set_temperature / climate.set_hvac_mode, so the scene scripts'
# generic climate.* calls demonstrably move them in dev. Heater target is an
# inert demo input_boolean (no real HVAC hardware in dev). entity_ids resolve
# to climate.kitchen_zone / climate.living_zone / climate.primary_zone.

  # ── Template lights (modern template: integration, HA 2026). `name` is
  #    chosen so the slug == the entity_id the b-panels demo binds to. Backed
  #    by input_boolean (on/off) + input_number (brightness 0-255) so generic
  #    light.turn_on/off + brightness_pct calls demonstrably actuate in dev. ──
  - light:
      - name: "Great Room Lights"
        unique_id: sig_great_room_lights
        state: "{{ is_state('input_boolean.sig_light_great_room','on') }}"
        level: "{{ states('input_number.sig_bright_great_room') | int(0) }}"
        turn_on:
          - service: input_boolean.turn_on
            target: { entity_id: input_boolean.sig_light_great_room }
          - if: "{{ (states('input_number.sig_bright_great_room') | int(0)) == 0 }}"
            then:
              - service: input_number.set_value
                target: { entity_id: input_number.sig_bright_great_room }
                data: { value: 255 }
        turn_off:
          - service: input_boolean.turn_off
            target: { entity_id: input_boolean.sig_light_great_room }
          - service: input_number.set_value
            target: { entity_id: input_number.sig_bright_great_room }
            data: { value: 0 }
        set_level:
          - service: input_number.set_value
            target: { entity_id: input_number.sig_bright_great_room }
            data: { value: "{{ brightness }}" }
          - service: "input_boolean.turn_{{ 'on' if (brightness | int) > 0 else 'off' }}"
            target: { entity_id: input_boolean.sig_light_great_room }
      - name: "Master Lights"
